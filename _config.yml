# ====== 友情链接（空数组表示不显示）======
friends: []

# ====== 构建配置 ======
highlighter: rouge
permalink: pretty
paginate: 10
anchorjs: true                     # 为标题自动添加锚点链接

# 排除无关文件，避免被复制到 _site 目录
exclude:
  - less
  - node_modules
  - Gruntfile.js
  - package.json
  - README.md
  - README.zh.md
  - Gemfile
  - Gemfile.lock
  - vendor

# 必须的插件（GitHub Pages 白名单内）
plugins:
  - jekyll-paginate

# ====== Markdown 渲染 ======
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# ====== 特色标签 ======
featured-tags: true
featured-condition-size: 1

# ====== PWA 相关 ======
chrome-tab-theme-color: "#000000"
service-worker: true

# ====== 数学公式（默认关闭）======
page-mathjax: false
